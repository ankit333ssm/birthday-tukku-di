<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tukku Di ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia,serif;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6,#ffe4c9);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#5b2638;
}

.container{
    width:90%;
    max-width:650px;
    text-align:center;
    padding:40px 25px;
    background:rgba(255,255,255,.55);
    border-radius:30px;
    box-shadow:0 15px 50px rgba(120,40,70,.2);
    backdrop-filter:blur(10px);
}

h1{
    font-size:42px;
    margin-bottom:15px;
}

.subtitle{
    font-size:20px;
    margin-bottom:30px;
}

.gift{
    font-size:100px;
    cursor:pointer;
    animation:bounce 1.5s infinite;
    display:inline-block;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

button{
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    background:#e85d8a;
    color:white;
    box-shadow:0 6px 15px rgba(180,50,90,.25);
}

button:hover{
    transform:scale(1.05);
}

.hidden{
    display:none;
}

.heart{
    position:fixed;
    bottom:-30px;
    animation:float 5s linear forwards;
    pointer-events:none;
}

@keyframes float{
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
   .balloons{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.balloons span{
    position:absolute;
    bottom:-120px;
    font-size:55px;
    animation:balloonUp 8s linear infinite;
}

.balloons span:nth-child(1){left:5%;animation-delay:0s;}
.balloons span:nth-child(2){left:22%;animation-delay:1.5s;}
.balloons span:nth-child(3){left:40%;animation-delay:3s;}
.balloons span:nth-child(4){left:58%;animation-delay:0.8s;}
.balloons span:nth-child(5){left:76%;animation-delay:2.2s;}
.balloons span:nth-child(6){left:90%;animation-delay:4s;}

@keyframes balloonUp{
    0%{
        bottom:-120px;
        transform:translateX(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    50%{
        transform:translateX(35px) rotate(8deg);
    }

    100%{
        bottom:110vh;
        transform:translateX(-35px) rotate(-8deg);
        opacity:0;
    }
} 
</style>
</head>

<body>
<div class="balloons">
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
</div>
<div class="container" id="opening">

    <h1>Hey Tukku Di... ❤️</h1>

    <p class="subtitle">
        Aapke liye kuch special hai... 🎁
    </p>

    <div class="gift" id="gift">🎁</div>

    <br><br>

    <button onclick="openGift()">
        Open The Gift 🎁
    </button>

</div>

<div class="container hidden" id="birthday">

    <div style="font-size:80px;">🎂</div>

    <h1>
        Happy Birthday<br>
        Priyadarshini ❤️
    </h1>

    <p class="subtitle">
        Happy Birthday Tukku Di 🌸
    </p>

    <p id="message">
        Aaj ka din bahut special hai,
        kyunki aaj ek bahut special insaan ka birthday hai. ❤️
    </p>

</div>

<script>

function openGift(){

    document.getElementById("opening").style.display="none";

    document.getElementById("birthday").classList.remove("hidden");

    createHearts();

}

function createHearts(){

    setInterval(function(){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"vw";

        heart.style.fontSize=
            (20+Math.random()*25)+"px";

        document.body.appendChild(heart);

        setTimeout(function(){
            heart.remove();
        },5000);

    },300);

}

</script>

</body>
</html>
